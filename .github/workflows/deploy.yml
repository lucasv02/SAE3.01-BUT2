name: Déploiement sur le serveur

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Vérification du code
        uses: actions/checkout@v3

      - name: Nettoyage du répo html
        run: |
          sudo rm -rf /var/www/html/pages-html/*
          echo "Target directory cleared."

      - name: Synchronisation du répertoire sur le serveur
        run: |
          sudo rsync -av --delete PHP-SAE/src/ /var/www/html/pages-html/
          echo "Deployment completed successfully."
