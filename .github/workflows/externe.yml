name: Déploiement via SFTP

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Nettoyage du dossier distant (sans supprimer les fichiers cachés)
        run: |
          lftp -c "
          open -u ${{ secrets.FTP_USER }},${{ secrets.FTP_PASSWORD }} sftp://${{ secrets.SFTP_HOST }};
          cd /sites/sae.lucasvieira.fr/;
          glob -a rm -rf -- [^.]*
          bye
          "
