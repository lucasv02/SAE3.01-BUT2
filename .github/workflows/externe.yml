name: Déploiement via SFTP

on:
  push:
    branches:
      - lucas
      - lea
      - seraphin
      - maden

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Déduction du répertoire cible en fonction de la branche
        id: vars
        run: |
          case "${GITHUB_REF##*/}" in
            lucas) echo "TARGET_DIR=sites/lucas.sae.lucasvieira.fr/" >> $GITHUB_OUTPUT ;;
            lea) echo "TARGET_DIR=sites/lea.sae.lucasvieira.fr/" >> $GITHUB_OUTPUT ;;
            seraphin) echo "TARGET_DIR=sites/seraphin.sae.lucasvieira.fr/" >> $GITHUB_OUTPUT ;;
            maden) echo "TARGET_DIR=sites/maden.sae.lucasvieira.fr/" >> $GITHUB_OUTPUT ;;
            *) echo "Branche non gérée"; exit 1 ;;
          esac

      - name: Création du fichier d'environnement PHP avec les secrets
        run: |
          echo "<?php
          putenv('DB_HOST=${{ secrets.DB_HOST }}');
          putenv('DB_USER=${{ secrets.DB_USER }}');
          putenv('DB_PASS=${{ secrets.DB_PASS }}');
          putenv('DB_NAME=${{ secrets.DB_NAME }}');
          " > PHP-SAE/src/php/env.php

      - name: Installation de lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Nettoyage du dossier distant (sans supprimer les fichiers cachés)
        run: |
          lftp -c "
          set sftp:auto-confirm yes;
          open -u ${{ secrets.FTP_USER }},${{ secrets.FTP_SECRET }} sftp://${{ secrets.FTP_HOST }};
          cd ${{ steps.vars.outputs.TARGET_DIR }};
          glob -a rm -rf -- [^.]*
          bye
          "

      - name: Envoi des fichiers via SFTP
        run: |
          lftp -c "
          set sftp:auto-confirm yes;
          open -u ${{ secrets.FTP_USER }},${{ secrets.FTP_SECRET }} sftp://${{ secrets.FTP_HOST }};
          mirror -R --parallel=10 --exclude-glob .* PHP-SAE/src/ ${{ steps.vars.outputs.TARGET_DIR }}
          bye
          "
